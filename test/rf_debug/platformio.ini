; RF 调试工程 (test/rf_debug) - 通过 UART3 命令行调试 RA-01 SX1278
; 独立于主固件 (主工程在项目根目录)
; 前提: OPT7 WAITSTATE=1 已烧录 (24MHz HSE 必须, 见根 doc/clock.md)
; 用法:
;   cd test/rf_debug
;   pio run -t upload      (ST-LINK SWIM 烧录)
;   pio device monitor     (UART3 115200 命令行)
[env:mb208]
platform = ststm8
board = mb208
framework = arduino
board_build.f_cpu = 24000000L
; 保留 SWIM 引脚
build_flags = -DENABLE_SWIM
upload_protocol = stlinkv2
monitor_speed = 115200
